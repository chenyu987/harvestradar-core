# 复制成 collector.toml 再改（collector.toml 不进 git）。./install.sh 第一次跑会自动复制。

[collector]
# 群名白名单，和聊天软件左栏里显示的一样（长名字被截成「...」也认得）。
# 有新消息的群会跑到左栏最上面，所以只在左栏前 sidebar_pages 屏里找；没找到说明没新消息，下一轮再看。
groups = ["某某活动群｜壹", "另一个活动群"]
sidebar_pages = 5         # 左栏最多往下翻几屏找群
max_screens = 15          # 每个群最多往上翻几屏
first_run_days = 3        # 第一次跑往回看几天
scroll_clicks = 30        # 每次滚轮滚几格（起始值）。两屏重叠太多会自动加大，完全不重叠会自动减小并在日志记 no_overlap
interval_minutes = [30, 60]   # 两轮之间随机等多久（run --every 20-40 可临时改）
run_hours = 0                 # run 跑多少小时后自己停；0 = 一直跑到 stop（run --hours 3 可临时改）
active_hours = [9, 23]        # 只在 9:00–22:59 跑
idle_minutes = 5              # 鼠标键盘都没人碰满这么久才开始一轮；中途有人动就放弃这一轮
pause_seconds = [1.5, 4.0]    # 每次滚动后随机停多久
group_pause_seconds = [20, 90] # 两个群之间随机停多久
out_dir = "data/collector"    # 截图、日志、状态都在这里（不进 git）
auto_layout = true            # 每张截图自动量出左栏、标题栏、输入框的位置；量不出来才用下面的 [layout]

[layout]
# 只在自动识别失败时用。单位是 pt，从聊天软件窗口左上角量。跑 check 看 calibrate.png。
sidebar_right = 340
header_bottom = 65
input_top_from_bottom = 160
search_box_bottom = 70
